<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#16161a;--mute:#6b6b73;--price:#e5362b;--btn:#16161a;--btnt:#fff;--chip:#e7e7e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101012;--card:#1b1b1f;--ink:#f3f3f1;--mute:#9a9aa2;--price:#ff5a4d;--btn:#ffd400;--btnt:#16161a;--chip:#26262b}}
:root[data-theme="dark"]{--bg:#101012;--card:#1b1b1f;--ink:#f3f3f1;--mute:#9a9aa2;--price:#ff5a4d;--btn:#ffd400;--btnt:#16161a;--chip:#26262b}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;padding:max(16px,env(safe-area-inset-top,0px)) 14px max(24px,env(safe-area-inset-bottom,0px));min-height:100%}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:6px 2px 10px}
header b{font-size:20px;letter-spacing:-.2px}
h1{font-size:26px;line-height:1.15;letter-spacing:-.5px;padding:6px 2px 14px}
nav{display:flex;gap:8px;overflow-x:auto;padding:0 0 14px;position:sticky;top:0;background:var(--bg);z-index:2}
nav a{flex:none;background:var(--chip);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;padding:8px 14px;border-radius:99px}
h2{font-size:18px;margin:10px 2px 10px;scroll-margin-top:56px}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:18px}
.card{background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:3/4;background:#e9e9e4;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:13px;color:#777}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-size:14px;line-height:1.3;font-weight:600}
.sub{font-size:12px;color:var(--mute)}
.price{font-size:20px;font-weight:800;color:var(--price);margin-top:auto}
.btn{display:block;text-align:center;text-decoration:none;background:var(--btn);color:var(--btnt);font-weight:700;font-size:14px;padding:11px;border-radius:12px}
.btn:focus-visible,nav a:focus-visible{outline:3px solid var(--price);outline-offset:2px}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
</style>
</head>
